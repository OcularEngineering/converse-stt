<!DOCTYPE html>
<!-- Generated by ocular-evals, Ocular AI's open-source Converse-STT harness (MIT License):
     https://github.com/OcularEngineering/converse-stt -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Converse-STT 2.0 · Ocular AI Converse</title>
  <style>
    :root {
      --bg: #fafaf8;
      --fg: #1c1b19;
      --muted: #6f6a63;
      --line: #e4e0d8;
      --soft: #f1eee8;
      --ink: #1c1b19;
      --mark: #8a3d2a;
      --fill: #e7b5a4;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }
    button, select { font: inherit; color: inherit; }
    a { color: inherit; }
    .wrap { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    header { padding: 72px 0 28px; text-align: center; }
    .eyebrow {
      margin: 0 0 14px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 { margin: 0; font-size: clamp(40px, 6vw, 68px); font-weight: 500; letter-spacing: -0.03em; line-height: 1.02; }
    .lede { max-width: 640px; margin: 18px auto 0; color: var(--muted); font-size: 18px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin: 48px auto 0;
      max-width: 920px;
      border-block: 1px solid var(--line);
      padding: 22px 0;
    }
    .stat strong { display: block; font-size: 28px; font-weight: 500; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 13px; }
    main { padding: 12px 0 80px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 460px); gap: 56px; align-items: start; }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
    .pill, .ghost { height: 40px; border-radius: 999px; border: 0; background: var(--soft); padding: 0 16px; cursor: pointer; }
    .ghost { background: transparent; border: 1px solid var(--line); }
    select.ghost { padding-right: 28px; }
    .pill[aria-pressed="true"], .ghost[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
    .views { display: flex; gap: 8px; flex-wrap: wrap; }
    .cols, .axis { display: flex; justify-content: space-between; color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
    .cols { margin-bottom: 8px; padding-left: 40px; }
    .axis { position: relative; height: 16px; margin: 0 0 8px 40px; }
    .axis span { position: absolute; top: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
    ol { list-style: none; margin: 0; padding: 0; }
    li.row { border-top: 1px solid var(--line); }
    li.row button.hit { display: flex; gap: 16px; width: 100%; text-align: left; background: transparent; border: 0; padding: 22px 8px 22px 0; cursor: pointer; border-radius: 12px; }
    li.row button.hit:hover, li.row.is-selected button.hit { background: rgba(28, 27, 25, 0.03); }
    .rank { width: 24px; flex: none; padding-top: 4px; color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; font-variant-numeric: tabular-nums; }
    .body { min-width: 0; flex: 1; }
    .name-line { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .name-line p { margin: 0; min-width: 0; }
    .name { font-weight: 560; }
    .vendor, .sub { color: var(--muted); }
    .score { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; flex: none; }
    .track { position: relative; height: 8px; margin-top: 22px; border-radius: 999px; background: var(--soft); }
    .track > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--bar, var(--fill)); }
    .track > b { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 2px; background: var(--mark-color, var(--mark)); transform: translate(-50%, -50%); }
    .sub { margin: 8px 0 0; font-size: 12px; }
    .panel { position: sticky; top: 24px; padding-top: 8px; }
    .panel h2 { margin: 0 0 8px; font-size: 28px; font-weight: 500; letter-spacing: -0.03em; }
    .panel .meta { margin: 0 0 18px; color: var(--muted); }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 18px 0; }
    .kpi { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
    .kpi b { display: block; font-variant-numeric: tabular-nums; font-weight: 560; }
    .kpi span { color: var(--muted); font-size: 12px; }
    details { border-top: 1px solid var(--line); padding: 14px 0; }
    details summary { cursor: pointer; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    details summary span:first-child { min-width: 0; }
    details .vendor { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    details summary::-webkit-details-marker { display: none; }
    .warn { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: #f8ebe6; color: #6d3326; font-size: 13px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .split h3 { margin: 0 0 6px; font-size: 12px; font-weight: 560; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
    .split p { margin: 0; font-size: 14px; line-height: 1.5; }
    .empty { color: var(--muted); }
    @media (max-width: 900px) {
      .layout, .stats, .split, .kpis { grid-template-columns: 1fr; }
      .panel { position: static; }
      header { padding-top: 40px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">Ocular AI Converse</p>
      <h1>Converse-STT 2.0</h1>
      <p class="lede" id="lede"></p>
      <div class="stats" id="stats"></div>
    </div>
  </header>
  <main>
    <div class="wrap layout">
      <section>
        <div class="toolbar">
          <div class="views" role="group" aria-label="What to rank">
            <button class="pill" type="button" id="view-board" aria-pressed="true">1.0 board + 2.0 runs</button>
            <button class="pill" type="button" id="view-run" aria-pressed="false">This sample</button>
            <select class="ghost" id="run-picker" hidden aria-label="Harness model"></select>
          </div>
          <div class="views">
            <button class="ghost" type="button" id="metric" aria-pressed="false">Show CER</button>
            <button class="ghost" type="button" id="scale" aria-pressed="false">Full scale</button>
          </div>
        </div>
        <div class="cols"><span>Model</span><span id="metric-label">WER</span></div>
        <div class="axis" id="axis-top"></div>
        <ol id="list"></ol>
        <div class="axis" id="axis-bottom" style="margin-top:18px;border-top:1px solid var(--line);padding-top:10px"></div>
      </section>
      <aside class="panel" id="panel"></aside>
    </div>
  </main>
  <script>
    const DATA = /*__DATA__*/ null;
    const COLORS = ["#e8ae91","#8eabbf","#c4b48a","#d4a08a","#9bb59a","#b7a3c4","#e0b07a","#8fb8b0","#d08a8a","#a8b07a","#9aa4c4","#c9a48a","#7fafc4","#c4a0b0","#b5a888"];
    const BOARD_SCALE = 15;
    const HAS_BOARD = DATA.published.length > 0;
    const firstRun = DATA.runs[0] ? DATA.runs[0].id : null;
    const state = { view: "board", metric: "wer", scale: BOARD_SCALE, selected: firstRun || (DATA.published[0] && DATA.published[0].name), runId: firstRun };

    function activeRun() {
      return DATA.runs.find((run) => run.id === state.runId) || DATA.runs[0];
    }
    function value(row) {
      return row[state.metric];
    }
    function pct(number) {
      return number === null || number === undefined ? "n/a" : `${number.toFixed(2)}%`;
    }

    function rows() {
      if (state.view === "run") {
        const run = activeRun();
        if (!run) return [];
        return [...run.conversations]
          .sort((a, b) => value(a) - value(b))
          .map((item, index) => ({
            id: item.id,
            kind: "conversation",
            name: item.title,
            vendor: `Conversation ${item.number}`,
            wer: item.wer,
            cer: item.cer,
            complete: item.complete,
            place: index + 1,
          }));
      }
      const published = state.metric === "wer"
        ? DATA.published.map((model, index) => ({ ...model, id: model.name, kind: "published", order: index }))
        : [];
      const combined = [
        ...published,
        ...DATA.runs.map((run, index) => ({
          id: run.id,
          kind: "run",
          name: run.name,
          vendor: run.vendor,
          wer: run.wer,
          cer: run.cer,
          href: run.href,
          order: DATA.published.length + index,
        })),
      ];
      combined.sort((a, b) => value(a) - value(b) || a.order - b.order);
      return combined.map((row, index) => ({ ...row, place: index + 1 }));
    }

    function axis(max) {
      const ticks = max <= BOARD_SCALE ? [0, 5, 10, 15] : [0, Math.round(max / 2), max];
      return ticks.map((tick) => {
        const left = (tick / max) * 100;
        const shift = tick === 0 ? "0" : tick === max ? "-100%" : "-50%";
        return `<span style="left:${left}%;transform:translateX(${shift})">${tick}%</span>`;
      }).join("");
    }

    function bar(score, rank, kind) {
      const width = Math.min(100, Math.max(0, (score / state.scale) * 100));
      const color = kind === "published" ? COLORS[(rank - 1) % COLORS.length] : "var(--ink)";
      const mark = kind === "published" ? color : "var(--mark)";
      return `<div class="track" style="--bar:${color};--mark-color:${mark}"><i style="width:${width}%"></i><b style="left:${width}%"></b></div>`;
    }

    function subtitle(row) {
      const clipped = state.scale < value(row) ? " Above the axis." : "";
      if (row.kind === "run") {
        const run = DATA.runs.find((item) => item.id === row.id);
        const other = state.metric === "wer" ? `CER ${pct(run.cer)}` : `WER ${pct(run.wer)}`;
        const partial = run.tracks < run.tracksTotal ? ` · ${run.tracks}/${run.tracksTotal} tracks` : ` · ${run.tracks} tracks`;
        return `${DATA.sampleLabel} · ${other}${partial} · ${run.numerator.toLocaleString()} / ${run.denominator.toLocaleString()} words.${clipped}`;
      }
      if (row.kind === "conversation") {
        const other = state.metric === "wer" ? `CER ${pct(row.cer)}` : `WER ${pct(row.wer)}`;
        return `${row.complete ? "Both speaker tracks, errors summed" : "Incomplete: not every track was transcribed"} · ${other}.${clipped}`;
      }
      const pipecat = row.pipecat !== undefined ? `Pipecat ${row.pipecat.toFixed(2)}% · rank ${String(row.pipecatRank).padStart(2, "0")} → ${String(row.rank).padStart(2, "0")}` : `${DATA.board.label || "Published"} · rank ${String(row.rank).padStart(2, "0")}`;
      return pipecat;
    }

    function renderList() {
      document.getElementById("axis-top").innerHTML = axis(state.scale);
      document.getElementById("axis-bottom").innerHTML = axis(state.scale);
      document.getElementById("metric-label").textContent = state.metric.toUpperCase();
      const list = document.getElementById("list");
      const items = rows();
      if (!items.length) {
        list.innerHTML = `<li class="row"><p class="empty" style="padding:22px 0">Nothing to rank yet. Score a run and rebuild this page.</p></li>`;
        return;
      }
      list.innerHTML = items.map((row) => `
        <li class="row ${state.selected === row.id ? "is-selected" : ""}">
          <button class="hit" type="button" data-id="${escapeAttr(row.id)}" data-kind="${escapeAttr(row.kind)}">
            <span class="rank">${String(row.place).padStart(2, "0")}</span>
            <span class="body">
              <span class="name-line">
                <p><span class="name">${escapeHtml(row.name)}</span> <span class="vendor">(${escapeHtml(row.vendor)})</span></p>
                <span class="score">${pct(value(row))}</span>
              </span>
              ${bar(value(row), row.kind === "published" ? row.rank : row.place, row.kind)}
              <p class="sub">${escapeHtml(subtitle(row))}</p>
            </span>
          </button>
        </li>`).join("");
      list.querySelectorAll("button.hit").forEach((button) => {
        button.addEventListener("click", () => {
          state.selected = button.dataset.id;
          if (button.dataset.kind === "run") state.runId = button.dataset.id;
          render();
        });
      });
    }

    function channelBlock(channel, modelName) {
      const label = channel.channel === "ch1" ? "Earlier microphone" : "Later microphone";
      const offset = channel.offsetS ? ` · starts ${channel.offsetS.toFixed(3)}s later` : " · timeline origin";
      const warn = channel.repeated
        ? `<p class="warn">“${escapeHtml(channel.repeated.text)}” is ${channel.repeated.count} of ${channel.repeated.segments} segments. The decode probably looped.</p>`
        : "";
      return `
        <details open>
          <summary><span><b>${label}</b> <span class="vendor">${channel.channel}${offset}</span></span><span class="score">WER ${pct(channel.wer)} · CER ${pct(channel.cer)}</span></summary>
          <div class="kpis">
            <div class="kpi"><b>${channel.hits.toLocaleString()}</b><span>Hits</span></div>
            <div class="kpi"><b>${channel.substitutions.toLocaleString()}</b><span>Substitutions</span></div>
            <div class="kpi"><b>${channel.deletions.toLocaleString()}</b><span>Deletions</span></div>
            <div class="kpi"><b>${channel.insertions.toLocaleString()}</b><span>Insertions</span></div>
          </div>
          <p class="sub">${channel.denominator.toLocaleString()} reference words · ${channel.cerErrors.toLocaleString()} / ${channel.cerDenominator.toLocaleString()} characters wrong${channel.latencyS ? ` · ${channel.latencyS}s to transcribe` : ""}</p>
          ${warn}
          <div class="split">
            <div><h3>Reference</h3><p>${escapeHtml(channel.reference)}</p></div>
            <div><h3>${escapeHtml(modelName)}</h3><p>${escapeHtml(channel.hypothesis)}</p></div>
          </div>
        </details>`;
    }

    function renderPanel() {
      const panel = document.getElementById("panel");
      const items = rows();
      const selected = items.find((row) => row.id === state.selected) || items[0];
      if (!selected) {
        panel.innerHTML = `<p class="empty">No runs yet.</p>`;
        return;
      }
      state.selected = selected.id;
      if (selected.kind === "published") {
        const pipecat = selected.pipecatRank !== undefined ? `, rank ${String(selected.pipecatRank).padStart(2, "0")} on Pipecat` : "";
        panel.innerHTML = `
          <p class="eyebrow">${escapeHtml(DATA.board.label || "Published score")}</p>
          <h2>${escapeHtml(selected.name)}</h2>
          <p class="meta">${escapeHtml(selected.vendor)} · rank ${String(selected.rank).padStart(2, "0")} on the Hi-Fi conversations${pipecat}.</p>
          <p>This row is the ${escapeHtml(DATA.board.updated || "published")} ${escapeHtml(DATA.board.name || "Converse-STT")} figure. The 2.0 harness has not rerun it, so there is no per-conversation breakdown or CER here.</p>
          ${selected.href ? `<p><a href="${escapeAttr(selected.href)}">Model site</a></p>` : ""}`;
        return;
      }
      if (selected.kind === "conversation") {
        const run = activeRun();
        const item = run.conversations.find((conversation) => conversation.id === selected.id);
        panel.innerHTML = `
          <p class="eyebrow">${escapeHtml(run.name)} · conversation ${item.number}</p>
          <h2>${escapeHtml(item.title)}</h2>
          <p class="meta">WER ${pct(item.wer)} · CER ${pct(item.cer)} across ${item.channels.length} track${item.channels.length === 1 ? "" : "s"}. Excerpts are the normalized text used for scoring.</p>
          ${item.channels.map((channel) => channelBlock(channel, run.name)).join("")}`;
        return;
      }
      const run = DATA.runs.find((item) => item.id === selected.id);
      const looped = run.conversations.some((item) => item.channels.some((channel) => channel.repeated));
      panel.innerHTML = `
        <p class="eyebrow">${escapeHtml(DATA.sampleLabel)}</p>
        <h2>${escapeHtml(run.name)}</h2>
        <p class="meta">WER ${pct(run.wer)} · ${run.numerator.toLocaleString()} errors / ${run.denominator.toLocaleString()} reference words<br>CER ${pct(run.cer)} · ${run.cerNumerator.toLocaleString()} errors / ${run.cerDenominator.toLocaleString()} characters<br>${escapeHtml(run.modelId)} · ${escapeHtml(run.profile)} normalization</p>
        <p>${looped ? "A repeated short phrase means the decode looped instead of following that speaker." : `Open a conversation to read the reference beside the transcript.${HAS_BOARD ? " This sample has no Pipecat score." : ""}`}</p>
        ${run.href ? `<p><a href="${escapeAttr(run.href)}">Model site</a></p>` : ""}
        ${run.conversations.map((item) => `
          <details>
            <summary><span><b>Conversation ${item.number}</b><span class="vendor">${escapeHtml(item.title)}</span></span><span class="score">${pct(item[state.metric])}</span></summary>
            ${item.channels.map((channel) => channelBlock(channel, run.name)).join("")}
          </details>`).join("")}`;
    }

    function renderStats() {
      const lede = HAS_BOARD
        ? `How accurately speech-to-text models transcribe real two-person American English conversations. Word and character error rate on the Ocular AI Hi-Fi recordings; a lower score is a more accurate transcript. ${DATA.board.label || "Published"} figures sit beside 2.0 harness runs from ${DATA.generated}.`
        : `How accurately speech-to-text models transcribe real two-person American English conversations. Word and character error rate on the Ocular AI Hi-Fi recordings; a lower score is a more accurate transcript. Every row is an independent 2.0 harness run; page built ${DATA.generated}.`;
      document.getElementById("lede").textContent = lede;
      const complete = DATA.runs.filter((run) => run.tracks === run.tracksTotal && run.wer !== null);
      const best = [...complete].sort((a, b) => a.wer - b.wer)[0];
      const bestCer = [...complete].sort((a, b) => a.cer - b.cer)[0];
      const sample = DATA.runs[0];
      const stats = [[String(DATA.published.length + DATA.runs.length), "Models on this page"]];
      if (best) stats.push([pct(best.wer), `Lowest WER · ${best.name}`]);
      if (bestCer) stats.push([pct(bestCer.cer), `Lowest CER · ${bestCer.name}`]);
      if (sample) stats.push([sample.denominator.toLocaleString(), `Reference words · ${sample.conversations.length} conversations`]);
      document.getElementById("stats").innerHTML = stats
        .map(([valueText, label]) => `<div class="stat"><strong>${valueText}</strong><span>${escapeHtml(label)}</span></div>`).join("");
    }

    function render() {
      const picker = document.getElementById("run-picker");
      picker.hidden = state.view !== "run";
      if (state.runId) picker.value = state.runId;
      renderList();
      renderPanel();
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function escapeAttr(text) { return escapeHtml(text); }

    function fullScale() {
      const max = Math.max(...rows().map((row) => value(row) || 0), BOARD_SCALE);
      if (max <= BOARD_SCALE) return BOARD_SCALE;
      return Math.ceil(max / 10) * 10;
    }
    function setScale(scale) {
      state.scale = scale;
      const button = document.getElementById("scale");
      const full = scale !== BOARD_SCALE;
      button.setAttribute("aria-pressed", String(full));
      button.textContent = full ? "Board scale" : "Full scale";
    }
    function bestConversation() {
      const run = activeRun();
      return run ? [...run.conversations].sort((a, b) => value(a) - value(b))[0].id : null;
    }
    function setPressed() {
      document.getElementById("view-board").setAttribute("aria-pressed", String(state.view === "board"));
      document.getElementById("view-run").setAttribute("aria-pressed", String(state.view === "run"));
      const metric = document.getElementById("metric");
      metric.setAttribute("aria-pressed", String(state.metric === "cer"));
      metric.textContent = state.metric === "cer" ? "Show WER" : "Show CER";
    }

    const picker = document.getElementById("run-picker");
    picker.innerHTML = DATA.runs.map((run) => `<option value="${escapeAttr(run.id)}">${escapeHtml(run.name)}</option>`).join("");
    picker.addEventListener("change", () => {
      state.runId = picker.value;
      state.selected = bestConversation();
      setScale(fullScale());
      render();
    });
    document.getElementById("view-board").addEventListener("click", () => {
      state.view = "board";
      state.selected = state.runId;
      setScale(BOARD_SCALE);
      setPressed();
      render();
    });
    document.getElementById("view-run").addEventListener("click", () => {
      if (!DATA.runs.length) return;
      state.view = "run";
      state.selected = bestConversation();
      setScale(fullScale());
      setPressed();
      render();
    });
    document.getElementById("metric").addEventListener("click", () => {
      state.metric = state.metric === "wer" ? "cer" : "wer";
      if (state.view === "board" && state.metric === "cer" && DATA.runs.length) state.selected = state.runId;
      setScale(state.scale === BOARD_SCALE ? BOARD_SCALE : fullScale());
      setPressed();
      render();
    });
    document.getElementById("scale").addEventListener("click", () => {
      setScale(state.scale === BOARD_SCALE ? fullScale() : BOARD_SCALE);
      render();
    });
    if (!DATA.runs.length) document.getElementById("view-run").disabled = true;
    if (!HAS_BOARD) {
      document.getElementById("view-board").textContent = "Models";
      document.getElementById("view-run").textContent = "Conversations";
    }
    setPressed();
    renderStats();
    render();
  </script>
</body>
</html>
