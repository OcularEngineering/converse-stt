name = "gpt-transcribe"
display_name = "GPT Transcribe"
vendor = "OpenAI"
provider = "openai-compatible"
model = "gpt-transcribe"
env = ["OPENAI_API_KEY"]
href = "https://platform.openai.com/docs/guides/speech-to-text"
