name = "gpt-4o-mini-transcribe"
display_name = "GPT-4o mini Transcribe"
vendor = "OpenAI"
provider = "openai-compatible"
model = "gpt-4o-mini-transcribe"
env = ["OPENAI_API_KEY"]
href = "https://platform.openai.com/docs/guides/speech-to-text"
notes = "chunking_strategy=auto is required: without it the GPT-4o transcription models drop long stretches of a 15-minute file. Uploads are 64 kbps mono MP3 (OpenAI caps uploads at 25 MB; requires ffmpeg)."

[options]
response_format = "json"
upload = "mp3"
chunking_strategy = "auto"
