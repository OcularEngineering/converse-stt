[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ocular-evals"
version = "0.1.0"
description = "Ocular AI Converse-STT harness: transcribe Ocular AI conversations with any speech-to-text model and score word and character error rate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Ocular AI" }]
keywords = ["asr", "speech-to-text", "benchmark", "wer", "cer", "converse-stt"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "httpx>=0.28,<1",
  "huggingface-hub>=1.0,<2",
  "jiwer>=4.0,<5",
  "numpy>=2.0,<3",
  "soundfile>=0.13,<1",
  "whisper-normalizer==0.1.12",
]

[project.optional-dependencies]
local = [
  "av==18.1.0",
  "ctranslate2==4.8.2",
  "faster-whisper==1.2.1",
  "tokenizers==0.23.2",
]

[project.urls]
Homepage = "https://github.com/OcularEngineering/converse-stt"
Leaderboard = "https://www.useocular.com/converse/stt"

[project.scripts]
ocular-evals = "ocular_evals.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ocular_evals"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
