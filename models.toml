display_name = "Whisper Large v3"
href = "https://github.com/SYSTRAN/faster-whisper"
notes = "Local CTranslate2 Whisper; needs `uv sync --extra local`."

[whisper-large-v3.options]
beam_size = 5
temperature = 0.0
condition_on_previous_text = false
vad_filter = true
compute_type = "default"
device = "auto"
